packages:
  - ai-docs
  - scratchpad
  - scripts
  - packages/*
  - packages/ai/*
  - packages/atom/*
  - packages/platform/*
  - packages/sql/*
  - packages/tools/*
  - examples/*

verifyDepsBeforeRun: error
enableGlobalVirtualStore: false

allowBuilds:
  core-js: false
  cpu-features: false
  dprint: false
  esbuild: false
  protobufjs: false
  sharp: false
  ssh2: false
  tree-sitter: false
  tree-sitter-javascript: false
  tree-sitter-typescript: false
  workerd: false

patchedDependencies:
  '@changesets/get-github-info@1.0.1': patches/@changesets__get-github-info@1.0.1.patch

overrides:
  "@vitest/browser@<5.0.5": "^5.0.5"
  "@vitest/ui@<5.0.5": "^5.0.5"
  "@vitest/mocker@<5.0.3": "^5.0.3"
  "vite@<8.2.4": "^8.2.4"
  "launch-editor@<2.14.2": "^2.14.2"
  "hono@<4.13.11": "^4.13.11"
  "sharp@<0.35.5": "^0.35.5"
  "shell-quote@<1.11.0": "^1.11.0"
  "seroval@<1.6.3": "^1.6.3"
  "source-map-js@<1.2.2": "^1.2.2"
  "stream-json@<3.6.0": "^3.6.0"
  "serialize-javascript@<7.1.2": "^7.1.2"
  "@grpc/grpc-js@<1.14.5": "^1.14.5"
  "nodemailer@<10.0.9": "^10.0.9"
  "fast-uri@<3.1.8": "^3.1.8"
  "brace-expansion@<1.1.21": "^1.1.21"
  "brace-expansion@>=2.0.0 <2.1.7": "^2.1.7"
  "brace-expansion@>=5.0.0 <5.0.12": "^5.0.12"
  "undici@<7.29.1": "^7.29.1"
  "image-size@<2.0.3": "^2.0.3"
  "js-yaml@<4.3.2": "^4.3.2"
